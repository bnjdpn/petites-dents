name: Build Petites Dents v1.0.7 signed evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Historical source commit (must match the locked candidate)
        required: true
        default: c4df7b3fa37adfd9f6de2e7420069c0fed6b7107
        type: string

permissions:
  contents: read

concurrency:
  group: petites-dents-v1.0.7-signed-backfill
  cancel-in-progress: false

jobs:
  build-evidence:
    name: Build signed APK evidence only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_COMMIT: c4df7b3fa37adfd9f6de2e7420069c0fed6b7107
      EXPECTED_VERSION_NAME: "1.0.7"
      EXPECTED_VERSION_CODE: "8"
      EXPECTED_SIGNER_SHA256: f126e90193736e65f8145d6cb6562487bce86cd609cc4a125ab754aaf7a6128f

    steps:
      - name: Checkout current main tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate locked candidate identity
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REQUESTED_SOURCE_COMMIT" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse "$EXPECTED_SOURCE_COMMIT^{commit}")" = "$EXPECTED_SOURCE_COMMIT"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_COMMIT" HEAD
          test "$EXPECTED_VERSION_NAME" = "1.0.7"
          test "$EXPECTED_VERSION_CODE" = "8"
          test "$EXPECTED_SIGNER_SHA256" = "f126e90193736e65f8145d6cb6562487bce86cd609cc4a125ab754aaf7a6128f"

      - name: Isolate Gradle user home
        shell: bash
        run: |
          set -euo pipefail
          gradle_user_home="$RUNNER_TEMP/gradle-user-home"
          mkdir -p "$gradle_user_home"
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_user_home" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Prepare detached historical source
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/petites-dents-v1.0.7-source"
          test ! -e "$worktree"
          mkdir -p "$GRADLE_USER_HOME"
          git worktree add --detach "$worktree" "$EXPECTED_SOURCE_COMMIT"
          printf 'WORKTREE_PATH=%s\n' "$worktree" >> "$GITHUB_ENV"

          ruby - "$worktree" <<'RUBY'
          root = File.expand_path(ARGV.fetch(0))
          replacements = {
            "app/build.gradle.kts" => [
              ["        versionCode = 7", "        versionCode = 8"],
              ["        versionName = \"1.0.6\"", "        versionName = \"1.0.7\""]
            ],
            "ios/project.yml" => [
              ["        MARKETING_VERSION: 1.0.6", "        MARKETING_VERSION: 1.0.7"]
            ],
            "ios/fastlane/release_config.json" => [
              ["  \"version\": \"1.0.6\",", "  \"version\": \"1.0.7\","]
            ]
          }

          replacements.each do |relative_path, pairs|
            path = File.join(root, relative_path)
            content = File.binread(path)
            pairs.each do |old_value, new_value|
              count = content.scan(old_value).length
              abort "Expected exactly one #{old_value.inspect} in #{relative_path}, found #{count}" unless count == 1
              abort "Replacement already present in #{relative_path}" if content.include?(new_value)
              content = content.sub(old_value, new_value)
            end
            File.binwrite(path, content)
          end
          RUBY

          mkdir -p "$worktree/release"
          install -m 0644 release/android_release.json "$worktree/release/android_release.json"
          git -C "$worktree" add -N release/android_release.json

          mapfile -t changed_files < <(git -C "$worktree" diff --name-only | sort)
          expected_files=(
            app/build.gradle.kts
            ios/fastlane/release_config.json
            ios/project.yml
            release/android_release.json
          )
          test "${changed_files[*]}" = "${expected_files[*]}"

          ruby scripts/release_alignment_guard.rb \
            --root "$worktree" \
            --expected-tag "v$EXPECTED_VERSION_NAME"

      - name: Build and test signed historical APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required GitHub Actions secret: $name" >&2; exit 1; }
          done

          keystore_path="$RUNNER_TEMP/petites-dents-v1.0.7.keystore"
          cleanup_keystore() {
            chmod u+w "$keystore_path" 2>/dev/null || true
            rm -f -- "$keystore_path"
          }
          trap cleanup_keystore EXIT
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          export ANDROID_RELEASE_STORE_FILE="$keystore_path"
          cd "$WORKTREE_PATH"
          ./gradlew --no-daemon --stacktrace test assembleRelease

      - name: Require non-empty JUnit execution
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' reports < <(find "$WORKTREE_PATH/app/build/test-results" -type f -name 'TEST-*.xml' -print0)
          if (( ${#reports[@]} == 0 )); then
            echo "::error::Gradle test produced no JUnit report (NO-SOURCE is forbidden)."
            exit 1
          fi
          grep -Eq '<testsuite[^>]* tests="[1-9][0-9]*"' "${reports[@]}"

      - name: Validate and package exact evidence
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/petites-dents-v1.0.7-evidence"
          apk="$assets_dir/petites-dents-v1.0.7.apk"
          checksum="$apk.sha256"
          provenance="$apk.provenance.json"
          mkdir -p "$assets_dir"

          build_tools_root="${ANDROID_HOME:?ANDROID_HOME is required}/build-tools"
          if [ ! -d "$build_tools_root" ]; then
            echo "::error::Android build-tools directory is missing: $build_tools_root"
            exit 1
          fi
          mapfile -t build_tools_candidates < <(
            find "$build_tools_root" -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort -V
          )
          if (( ${#build_tools_candidates[@]} == 0 )); then
            echo "::error::No Android build-tools version found under $build_tools_root"
            exit 1
          fi
          build_tools="${build_tools_candidates[$((${#build_tools_candidates[@]} - 1))]}"
          ANDROID_AAPT="$build_tools/aapt"
          ANDROID_APKSIGNER="$build_tools/apksigner"
          if [ ! -x "$ANDROID_AAPT" ]; then
            echo "::error::aapt is missing or not executable: $ANDROID_AAPT"
            exit 1
          fi
          if [ ! -x "$ANDROID_APKSIGNER" ]; then
            echo "::error::apksigner is missing or not executable: $ANDROID_APKSIGNER"
            exit 1
          fi
          export ANDROID_AAPT ANDROID_APKSIGNER

          ruby scripts/prepare_android_release.rb \
            --root "$WORKTREE_PATH" \
            --apk "$WORKTREE_PATH/app/build/outputs/apk/release/app-release.apk" \
            --output-dir "$assets_dir" \
            --source-commit "$EXPECTED_SOURCE_COMMIT"

          ruby scripts/release_alignment_guard.rb \
            --root "$WORKTREE_PATH" \
            --expected-tag "v$EXPECTED_VERSION_NAME" \
            --apk "$apk" \
            --checksum "$checksum" \
            --provenance "$provenance"

          ruby -rjson - "$provenance" <<'RUBY'
          payload = JSON.parse(File.read(ARGV.fetch(0)))
          expected = {
            "tag" => "v1.0.7",
            "version_name" => "1.0.7",
            "version_code" => 8,
            "source_commit" => "c4df7b3fa37adfd9f6de2e7420069c0fed6b7107",
            "certificate_sha256" => "f126e90193736e65f8145d6cb6562487bce86cd609cc4a125ab754aaf7a6128f",
            "source_diff_files" => [
              "app/build.gradle.kts",
              "ios/fastlane/release_config.json",
              "ios/project.yml",
              "release/android_release.json"
            ]
          }
          expected.each do |key, value|
            abort "Provenance #{key}=#{payload[key].inspect}, expected #{value.inspect}" unless payload[key] == value
          end
          RUBY

          {
            printf 'EVIDENCE_APK=%s\n' "$apk"
            printf 'EVIDENCE_CHECKSUM=%s\n' "$checksum"
            printf 'EVIDENCE_PROVENANCE=%s\n' "$provenance"
          } >> "$GITHUB_ENV"

      - name: Upload short-lived build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: petites-dents-v1.0.7-signed-evidence-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_APK }}
            ${{ env.EVIDENCE_CHECKSUM }}
            ${{ env.EVIDENCE_PROVENANCE }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove detached worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${WORKTREE_PATH:-}" ] && [ -e "$WORKTREE_PATH/.git" ]; then
            git worktree remove --force "$WORKTREE_PATH"
          fi
